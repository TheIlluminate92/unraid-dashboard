name: Verify plugin manifest

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: windows-latest
    strategy:
      matrix:
        php: ['8.2', '8.3', '8.4']
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Install PHP for controller tests
        uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # v2
        with:
          php-version: ${{ matrix.php }}
      - name: Build and verify manifest
        shell: pwsh
        run: .\src\waz-dashboard-plugin\tests\verify.ps1

  verify-linux-installer:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        php: ['8.2', '8.4']
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # v2
        with:
          php-version: ${{ matrix.php }}
      - name: Build and verify canonical installer safeguards
        run: |
          node --test src/waz-dashboard-plugin/tests/cpu-view.test.mjs
          node --test src/waz-dashboard-plugin/tests/optional-fans.test.mjs
          bash src/waz-dashboard-plugin/scripts/build.sh
          php src/waz-dashboard-plugin/tests/registration.php src/waz-dashboard-plugin/dist/waz.dashboard.plg
          bash src/waz-dashboard-plugin/tests/installer-helper.sh
          php src/waz-dashboard-plugin/tests/audit.php
          php src/waz-dashboard-plugin/tests/pool-only.php
          php src/waz-dashboard-plugin/tests/gpu-lifecycle.php
          php src/waz-dashboard-plugin/tests/activation.php src/waz-dashboard-plugin/dist/waz.dashboard.plg
          cd releases && sha256sum -c SHA256SUMS
