name: Bug report
description: Report a reproducible dashboard problem
title: "[Bug]: "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: "Never include credentials, hostnames, network addresses, disk serial numbers, share names, tokens, or private configuration files."
  - type: input
    id: versions
    attributes:
      label: Dashboard and Unraid versions
      placeholder: "Dashboard v0.8.1; Unraid 7.3.2"
    validations:
      required: true
  - type: input
    id: browser
    attributes:
      label: Browser and relevant plugin versions
  - type: textarea
    id: problem
    attributes:
      label: What happened?
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What did you expect?
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Reproduction steps
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Optional redacted screenshots or logs
      description: Review every attachment before uploading it. Attachments to this public repository are public.
    validations:
      required: false
  - type: checkboxes
    id: privacy
    attributes:
      label: Privacy check
      options:
        - label: I reviewed every attached file and removed private or unique identifiers.
          required: true
